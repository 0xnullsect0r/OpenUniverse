name: Validate GDScript

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  GODOT_VERSION: "4.6.3"

jobs:
  validate:
    name: GDScript Parse Check
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" \
            -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Run GDScript parse check
        run: |
          set +e
          output=$(timeout 60 godot --headless --quit --verbose 2>&1)
          echo "$output"
          if echo "$output" | grep -qiE "(Parse error|Failed to load script|Script failed to parse)"; then
            echo ""
            echo "=== PARSE ERRORS DETECTED ==="
            echo "$output" | grep -iE "(Parse error|Failed to load script|Script failed to parse|ERROR:)"
            exit 1
          fi
          echo "All scripts parsed successfully."
