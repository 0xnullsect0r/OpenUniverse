name: Release Builds

on:
  push:
    tags:
      - 'v*'

env:
  GODOT_VERSION: "4.6.3"
  EXPORT_NAME: "OpenUniverse"

jobs:
  export:
    name: Export ${{ matrix.platform }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows Desktop
            artifact: windows
            preset: "Windows Desktop"
            out_file: "OpenUniverse.exe"

          - platform: Linux x86_64
            artifact: linux-x86_64
            preset: "Linux x86_64"
            out_file: "OpenUniverse.x86_64"


    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip" \
            -O godot.zip
          unzip -q godot.zip
          sudo mv "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" \
            -O templates.tpz
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/"
          rm -rf templates templates.tpz

      - name: Import project assets
        run: |
          # Run headless to generate .godot/ import cache, then quit
          timeout 60 godot --headless --quit 2>&1 | tail -10 || true
          # Give it a moment to flush writes
          sleep 3

      - name: Create output directory
        run: mkdir -p "build/${{ matrix.artifact }}"

      - name: Export ${{ matrix.platform }}
        run: |
          godot --headless \
            --export-release "${{ matrix.preset }}" \
            "$(pwd)/build/${{ matrix.artifact }}/${{ matrix.out_file }}" \
            2>&1
          ls -lh "build/${{ matrix.artifact }}/" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}/
          retention-days: 7

  package-deb:
    name: Package .deb (Linux x86_64)
    runs-on: ubuntu-22.04
    needs: export
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-linux-x86_64
          path: bin/

      - name: Build .deb package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_ROOT="deb_pkg"
          BIN_SRC="bin/${{ env.EXPORT_NAME }}.x86_64"

          chmod +x "$BIN_SRC"
          mkdir -p "$PKG_ROOT/DEBIAN" \
                   "$PKG_ROOT/usr/games" \
                   "$PKG_ROOT/usr/share/applications"

          install -Dm755 "$BIN_SRC" "$PKG_ROOT/usr/games/openuni-verse"

          # Write control file — no heredoc to avoid YAML-indentation in content
          {
            echo "Package: openuni-verse"
            echo "Version: $VERSION"
            echo "Section: games"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: OpenUniverse <noreply@github.com>"
            echo "Description: OpenUniverse -- Reverse Universe Simulator"
            echo " A Universe Sandbox-style simulator with full reverse physics mode."
          } > "$PKG_ROOT/DEBIAN/control"

          {
            echo "[Desktop Entry]"
            echo "Name=OpenUniverse"
            echo "Exec=/usr/games/openuni-verse"
            echo "Type=Application"
            echo "Categories=Game;Simulation;"
          } > "$PKG_ROOT/usr/share/applications/openuni-verse.desktop"

          dpkg-deb --build "$PKG_ROOT" "${{ env.EXPORT_NAME }}-${VERSION}-amd64.deb"
          ls -lh ./*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-deb
          path: "*.deb"
          retention-days: 7

  package-rpm:
    name: Package .rpm (Linux x86_64)
    runs-on: ubuntu-22.04
    needs: export
    steps:
      - uses: actions/checkout@v4

      - name: Install rpmbuild
        run: sudo apt-get install -y rpm

      - name: Download Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-linux-x86_64
          path: bin/

      - name: Build .rpm package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          RPM_VERSION="${VERSION//-/_}"
          BIN_SRC="$(pwd)/bin/${{ env.EXPORT_NAME }}.x86_64"

          chmod +x "$BIN_SRC"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Put binary in SOURCES so rpmbuild can find it
          cp "$BIN_SRC" ~/rpmbuild/SOURCES/openuni-verse

          SPEC="$HOME/rpmbuild/SPECS/openuni-verse.spec"
          {
            echo "Name:           openuni-verse"
            echo "Version:        $RPM_VERSION"
            echo "Release:        1"
            echo "Summary:        OpenUniverse -- Reverse Universe Simulator"
            echo "License:        MIT"
            echo "BuildArch:      x86_64"
            echo "Source0:        openuni-verse"
            echo ""
            echo "%description"
            echo "A Universe Sandbox-style simulator with full reverse physics mode."
            echo ""
            echo "%install"
            echo "install -Dm755 %{_sourcedir}/openuni-verse %{buildroot}/usr/games/openuni-verse"
            echo ""
            echo "%files"
            echo "/usr/games/openuni-verse"
            echo ""
            echo "%changelog"
            printf "* %s GitHub Actions <noreply@github.com> - %s-1\n" \
              "$(date '+%a %b %d %Y')" "$RPM_VERSION"
            echo "- Release $RPM_VERSION"
          } > "$SPEC"

          rpmbuild -bb "$SPEC"
          cp ~/rpmbuild/RPMS/x86_64/*.rpm .
          ls -lh ./*.rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-rpm
          path: "*.rpm"
          retention-days: 7

  package-flatpak:
    name: Package .flatpak
    runs-on: ubuntu-22.04
    needs: export
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-linux-x86_64
          path: bin/

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Cache Flatpak SDK
        id: cache-flatpak-sdk
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-sdk-freedesktop-23.08-v1

      - name: Install Flatpak SDK
        if: steps.cache-flatpak-sdk.outputs.cache-hit != 'true'
        run: |
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform//23.08 \
            org.freedesktop.Sdk//23.08

      - name: Prepare binary and manifest
        run: |
          set -euo pipefail
          BIN_SRC="bin/${{ env.EXPORT_NAME }}.x86_64"
          chmod +x "$BIN_SRC"
          mkdir -p flatpak_src
          cp "$BIN_SRC" flatpak_src/openuni-verse

          # Write flatpak manifest — avoid heredoc indentation
          {
            echo "app-id: com.github.openuni-verse"
            echo "runtime: org.freedesktop.Platform"
            echo "runtime-version: '23.08'"
            echo "sdk: org.freedesktop.Sdk"
            echo "command: openuni-verse"
            echo ""
            echo "finish-args:"
            echo "  - --share=ipc"
            echo "  - --socket=fallback-x11"
            echo "  - --socket=wayland"
            echo "  - --device=dri"
            echo ""
            echo "modules:"
            echo "  - name: openuni-verse"
            echo "    buildsystem: simple"
            echo "    build-commands:"
            echo "      - install -Dm755 openuni-verse /app/bin/openuni-verse"
            echo "    sources:"
            echo "      - type: file"
            echo "        path: flatpak_src/openuni-verse"
          } > com.github.openuni-verse.yml

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --repo=flatpak_repo \
            --force-clean \
            flatpak_build \
            com.github.openuni-verse.yml
          flatpak build-bundle flatpak_repo \
            "${{ env.EXPORT_NAME }}.flatpak" \
            com.github.openuni-verse
          ls -lh ./*.flatpak

      - name: Upload .flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-flatpak
          path: "*.flatpak"
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [export, package-deb, package-rpm, package-flatpak]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/

      - name: Collect and rename release files
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME}"
          mkdir -p final_assets

          # Windows .exe
          find "release_assets/${{ env.EXPORT_NAME }}-windows/" -name "*.exe" \
            -exec cp {} "final_assets/${{ env.EXPORT_NAME }}-${V}-windows.exe" \; 2>/dev/null || true

          # Linux x86_64
          find "release_assets/${{ env.EXPORT_NAME }}-linux-x86_64/" -name "*.x86_64" \
            -exec cp {} "final_assets/${{ env.EXPORT_NAME }}-${V}-linux.x86_64" \; 2>/dev/null || true
          find "final_assets/" -name "*.x86_64" -exec chmod +x {} \; 2>/dev/null || true

          # .deb
          find "release_assets/${{ env.EXPORT_NAME }}-deb/" -name "*.deb" \
            -exec cp {} "final_assets/" \; 2>/dev/null || true

          # .rpm
          find "release_assets/${{ env.EXPORT_NAME }}-rpm/" -name "*.rpm" \
            -exec cp {} "final_assets/" \; 2>/dev/null || true

          # .flatpak
          find "release_assets/${{ env.EXPORT_NAME }}-flatpak/" -name "*.flatpak" \
            -exec cp {} "final_assets/${{ env.EXPORT_NAME }}-${V}.flatpak" \; 2>/dev/null || true

          echo "=== Release assets ==="
          ls -lh final_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenUniverse ${{ github.ref_name }}"
          body: |
            ## OpenUniverse ${{ github.ref_name }}

            A Universe Sandbox-style simulator with full **Reverse Physics** mode.
            Built with Godot ${{ env.GODOT_VERSION }}.

            ### Downloads

            | Platform | File |
            |---|---|
            | Windows | `*-windows.exe` |
            | Linux x86_64 | `*-linux.x86_64` — `chmod +x` then run |
            | Debian / Ubuntu | `*.deb` — `sudo dpkg -i *.deb` |
            | Fedora / RHEL | `*.rpm` — `sudo rpm -i *.rpm` |
            | Flatpak (any distro) | `*.flatpak` — `flatpak install *.flatpak` |

            ### What's new
            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
          files: final_assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
