[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/windows/OpenUniverse.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="x86_64"
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/windows_subsystem=0
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="OpenUniverse"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -Force '{temp_dir}\\{archive_name}' '{temp_dir}\\app'
$action = New-ScheduledTaskAction -Execute '{temp_dir}\\app\\{exe_name}' -Argument '{cmd_args}'
$trigger = New-ScheduledTaskTrigger -Once -At 00:00
$settings = New-ScheduledTaskSettingsSet
$task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings
Register-ScheduledTask godot_remote_debug -InputObject $task -Force
Start-ScheduledTask -TaskName godot_remote_debug
"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName godot_remote_debug
Unregister-ScheduledTask -TaskName godot_remote_debug -Confirm:$false
Remove-Item -Recurse -Force '{temp_dir}\\app'
Remove-Item -Force '{temp_dir}\\{archive_name}'
"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/macos/OpenUniverse.app"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
notarization/notarization=0
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}/app\"
open \"{temp_dir}/app/{exe_name}\" --args {cmd_args}
"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -x {exe_name})
rm -rf \"{temp_dir}/app\"
rm -f \"{temp_dir}/{archive_name}\"
"
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.openuni-verse.app"
application/signature=""
application/app_category="public.app-category.games"
application/short_version=""
